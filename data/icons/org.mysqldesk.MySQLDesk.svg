<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cylGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" filter="url(#dropShadow)"/>
  
  <!-- Database Stack -->
  <!-- Bottom layer -->
  <path d="M 32 78 C 32 86, 96 86, 96 78 L 96 90 C 96 98, 32 98, 32 90 Z" fill="url(#cylGrad)" opacity="0.8"/>
  <ellipse cx="64" cy="78" rx="32" ry="8" fill="#38bdf8" opacity="0.3"/>
  
  <!-- Middle layer -->
  <path d="M 32 58 C 32 66, 96 66, 96 58 L 96 70 C 96 78, 32 78, 32 70 Z" fill="url(#cylGrad)" opacity="0.9"/>
  <ellipse cx="64" cy="58" rx="32" ry="8" fill="#38bdf8" opacity="0.4"/>
  
  <!-- Top layer -->
  <path d="M 32 38 C 32 46, 96 46, 96 38 L 96 50 C 96 58, 32 58, 32 50 Z" fill="url(#cylGrad)"/>
  <ellipse cx="64" cy="38" rx="32" ry="8" fill="#7dd3fc"/>

  <!-- Status Indicator Dot -->
  <circle cx="94" cy="34" r="7" fill="#22c55e" stroke="#0f172a" stroke-width="2"/>
  <circle cx="94" cy="34" r="3" fill="#86efac"/>
</svg>
